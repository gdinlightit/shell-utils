set -g mouse on
set -g default-terminal "tmux-256color"
set -g history-limit 50000

# Push tmux window name into the terminal's OSC title so VSCode's tab title
# (terminal.integrated.tabs.title: "${sequence}") follows it automatically.
set -g set-titles on
set -g set-titles-string '#W'

set -g base-index 1
set -g pane-base-index 1

set -g status-interval 5
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M"
set -g status-style fg=white,bg=default

set -g escape-time 10

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- Plugins (tmux-resurrect + tmux-continuum: persist/auto-restore sessions,
# windows, pane layouts, and names across reboots) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (must be the last line in tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

